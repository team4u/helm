# electron-builder production packaging config (project root = packages/desktop; the
# entry is package.json main -> ./dist/main.js, the tsc output, so no extra bundling step).
#
# Honesty boundaries (kept in sync with the README "Production packaging" section):
# - The Hub runtime (kernel dist / web dist / built-in plugin runtime assets) is assembled
#   by scripts/assemble-hub.mjs into ./hub and lands at <resources>/hub via extraResources,
#   entirely outside asar: the Hub runs as an ELECTRON_RUN_AS_NODE child process, so the
#   native esbuild binary and the materialized node_modules must be real files and cannot
#   go inside asar.
# - Unsigned / un-notarized: no certificate assets; mac uses an explicit identity: null;
#   NSIS / AppImage / deb are unsigned.
# - No app icon provided: uses the Electron default icon, no fabricated icon assets.
# - Business payloads update via npm; replacing the Electron base in full still requires
#   the user to download an installer.

# Placeholder reverse-domain (usable before an official distribution domain exists;
# adjust uniformly when signing/notarization is wired up).
appId: dev.helm.desktop
productName: Helm
artifactName: "Helm-${version}-${os}-${arch}.${ext}"

directories:
  # Output directory (distinct from tsc's dist/): release/ holds per-platform installers
  # and *-unpacked directories.
  output: release

# The desktop shell itself goes into asar: small, pure JS, no native modules, no files
# executed directly by child processes.
asar: true
files:
  - package.json
  - dist/**/*

# There are currently no native artifacts inside asar; this is a defensive declaration —
# if native content ever lands in files by mistake, the build will place it in
# app.asar.unpacked preserving real-file semantics (the Hub runtime itself goes through
# extraResources and is naturally unaffected by asar).
asarUnpack:
  - "**/*.node"

extraResources:
  - from: dist/hub-child.js
    to: hub-child.mjs
  # The Hub payload assembled by assemble-hub.mjs -> <resources>/hub (outside asar).
  # If missing, first run pnpm --filter @helm/desktop run assemble:hub (requires pnpm
  # build at the repo root).
  # electron-builder always filters node_modules under the from root; matching the hub
  # subtree from the parent directory preserves the dependencies.
  - from: .
    to: .
    filter:
      - "hub/**/*"

mac:
  target:
    - dmg
    - zip
  # Explicitly disable signing (no certificate; default auto-discovery behaves
  # non-deterministically in certificate-less environments).
  # An unsigned dmg needs right-click "Open" or xattr -dr com.apple.quarantine to bypass
  # Gatekeeper on first launch.
  identity: null

win:
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

deb:
  packageName: helm-desktop

linux:
  executableName: helm-desktop
  target:
    - AppImage
    - deb
  maintainer: jay.wu <fjayblue@126.com>
