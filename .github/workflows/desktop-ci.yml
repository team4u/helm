# Desktop CI：packages/desktop（Electron 桌面壳）三平台构建、测试、打包与冒烟。
#
# 职责边界（与 ci.yml 互补、不重复）：
#   - ci.yml 负责仓库全量测试（Linux 全量 / Windows unit）；本工作流不在三个平台
#     重复跑 pnpm test:all / test:unit，专注 desktop 包自身的验证与产物。
#   - 三平台 matrix（Linux/Windows/macOS）：install frozen → typecheck/build
#     （assemble-hub 依赖 workspace dist 产物）→ desktop 包测试 → dist:dir 解包应用
#     → scripts/desktop-smoke.mjs --packaged 对打包 App 冒烟 → dist --publish never
#     产出安装包（exe/dmg/zip/AppImage/deb）作为 CI artifact 上传，绝不自动发布。
#   - 冒烟报告目录（smoke.json / 截图 / stdout.log / stderr.log）if: always() 上传，
#     失败时保留现场供诊断。
#   - Linux：Electron 无头运行需要 Xvfb 与 GPU/音频库；ubuntu-24.04 的 ALSA 运行时
#     包为 libasound2t64（旧 libasound2 包名在 24.04 已不存在，装错会直接 apt 失败）。
#   - desktop 包契约由 scripts/desktop-ci-contract.mjs 元数据驱动检查（缺失/缺 build
#     脚本显式失败，不静默跳过）。

name: Desktop CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: desktop / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Electron 无头运行需要 X server 与 GPU/音频库；xvfb-run 为下方测试/冒烟步骤
      # 按需启动隔离的虚拟显示（-a 自动分配显示号）。
      - name: Install Xvfb and Electron runtime libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgbm1 libasound2t64

      # 契约检查：desktop 必须有 name 与 build 脚本（pnpm -r build 会静默跳过无 build
      # 的包），并输出 desktop_name / desktop_has_test 供后续步骤引用。
      - name: Desktop package contract check
        id: contract
        shell: bash
        run: node scripts/desktop-ci-contract.mjs --github-output "$GITHUB_OUTPUT"

      - name: Typecheck
        run: pnpm typecheck

      # assemble-hub 组装依赖 kernel/web dist 产物，必须先全仓构建。
      - name: Build packages
        run: pnpm build

      # desktop 自有测试（Electron 相关执行在 Linux 上必须 xvfb-run 包裹）。
      - name: Desktop package tests under Xvfb (Linux)
        if: runner.os == 'Linux' && steps.contract.outputs.desktop_has_test == 'true'
        run: xvfb-run -a pnpm --filter "${{ steps.contract.outputs.desktop_name }}" run test

      - name: Desktop package tests (Windows / macOS)
        if: runner.os != 'Linux' && steps.contract.outputs.desktop_has_test == 'true'
        run: pnpm --filter "${{ steps.contract.outputs.desktop_name }}" run test

      # 解包应用（release/<platform>-unpacked）：供打包形态冒烟，最快验证 App 可拉起。
      - name: Build unpacked desktop app (dist:dir)
        run: pnpm --filter "${{ steps.contract.outputs.desktop_name }}" run dist:dir

      # 打包 App 冒烟：wrapper 定位解包可执行文件，隔离 HELM_DATA_DIR、固定 3202 端口，
      # 60s 超时杀树，依据 smoke.json 判定；报告落在 packages/desktop/release/smoke/。
      - name: Smoke test packaged app under Xvfb (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/desktop-smoke.mjs --packaged

      - name: Smoke test packaged app (Windows / macOS)
        if: runner.os != 'Linux'
        run: node scripts/desktop-smoke.mjs --packaged

      # 截图 / smoke.json / 日志永远上传（失败现场比成功存档更重要）。
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ matrix.os }}
          path: packages/desktop/release/smoke/
          if-no-files-found: warn
          retention-days: 7

      # 安装包产物（NSIS exe / dmg / zip / AppImage / deb）：--publish never，
      # 永不在此发布；任何平台一个安装包都没产出视为真实失败。
      - name: Build desktop installers (publish never)
        run: pnpm --filter "${{ steps.contract.outputs.desktop_name }}" run dist

      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 14
