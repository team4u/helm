# Desktop CI: three-platform build, test, packaging and smoke for packages/desktop
# (the Electron desktop shell).
#
# Responsibility boundary (complementary to ci.yml, no duplication):
#   - ci.yml runs the repository's full test suite (full suite on Linux / unit on
#     Windows); this workflow does not repeat pnpm test:all / test:unit on the three
#     platforms, it focuses on the desktop package's own validation and artifacts.
#   - Three-platform matrix (Linux/Windows/macOS): install frozen -> typecheck/build
#     (assemble-hub depends on workspace dist artifacts) -> desktop package tests ->
#     dist:dir unpacked app -> scripts/desktop-smoke.mjs --packaged smoke against the
#     packaged app -> dist --publish never producing installers (exe/dmg/zip/AppImage/deb)
#     uploaded as CI artifacts, never auto-published.
#   - The smoke report directory (smoke.json / screenshots / stdout.log / stderr.log) is
#     uploaded if: always(), preserving the failure scene for diagnosis.
#   - Linux: headless Electron needs Xvfb plus GPU/audio libs; on ubuntu-24.04 the ALSA
#     runtime package is libasound2t64 (the old libasound2 package name no longer exists
#     on 24.04; installing the wrong one fails apt outright).
#   - The desktop package contract is checked metadata-driven by
#     scripts/desktop-ci-contract.mjs (a missing package or missing build script fails
#     explicitly, never silently skipped).

name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: desktop / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Headless Electron needs an X server plus GPU/audio libs; xvfb-run starts an
      # isolated virtual display on demand for the test/smoke steps below
      # (-a auto-picks a display number).
      - name: Install Xvfb and Electron runtime libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgbm1 libasound2t64

      # Contract check: the desktop package must have a name and a build script
      # (pnpm -r build silently skips packages without build), and it emits desktop_name /
      # desktop_has_test for later steps to reference.
      - name: Desktop package contract check
        id: contract
        shell: bash
        run: node scripts/desktop-ci-contract.mjs --github-output "$GITHUB_OUTPUT"

      - name: Typecheck
        run: pnpm typecheck

      # assemble-hub assembly depends on kernel/web dist artifacts; build the whole repo first.
      - name: Build packages
        run: pnpm build

      - name: Verify npm payload pack/install/start (Linux)
        if: runner.os == 'Linux'
        env:
          PAYLOAD_NPM_SMOKE: '1'
        run: node scripts/run-tests.mjs packages/payload/test/payload.test.ts

      # The desktop package's own tests (Electron-related execution on Linux must be
      # wrapped in xvfb-run).
      - name: Desktop package tests under Xvfb (Linux)
        if: runner.os == 'Linux' && steps.contract.outputs.desktop_has_test == 'true'
        run: xvfb-run -a pnpm --filter "${{ steps.contract.outputs.desktop_name }}" run test

      - name: Desktop package tests (Windows / macOS)
        if: runner.os != 'Linux' && steps.contract.outputs.desktop_has_test == 'true'
        run: pnpm --filter "${{ steps.contract.outputs.desktop_name }}" run test

      # Unpacked app (release/<platform>-unpacked): for packaged-form smoke, the fastest
      # check that the app can launch.
      - name: Build unpacked desktop app (dist:dir)
        run: pnpm --filter "${{ steps.contract.outputs.desktop_name }}" run dist:dir

      - name: Configure Linux sandbox helper
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root packages/desktop/release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 packages/desktop/release/linux-unpacked/chrome-sandbox

      # Packaged-app smoke: the wrapper locates the unpacked executable, isolates
      # HELM_DATA_DIR, pins port 3202, kills the process tree after a 60s timeout, and
      # judges by smoke.json; the report lands in packages/desktop/release/smoke/.
      - name: Smoke test packaged app under Xvfb (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/desktop-smoke.mjs --packaged

      - name: Smoke test packaged app (Windows / macOS)
        if: runner.os != 'Linux'
        run: node scripts/desktop-smoke.mjs --packaged

      # Screenshots / smoke.json / logs are always uploaded (a failure scene matters
      # more than a success archive).
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ matrix.os }}
          path: packages/desktop/release/smoke/
          if-no-files-found: warn
          retention-days: 7

      # Installer artifacts (NSIS exe / dmg / zip / AppImage / deb): --publish never,
      # never published here; a platform producing zero installers is treated as a real
      # failure.
      - name: Build desktop installers (publish never)
        run: pnpm --filter "${{ steps.contract.outputs.desktop_name }}" run dist

      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 14
