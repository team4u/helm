name: Debug proc scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe /proc readability as runner user
        run: |
          node -e '
          const { readdirSync, readlinkSync, statSync } = require("node:fs");
          const me = process.getuid();
          const denials = [];
          const blind = [];
          let scanned = 0;
          for (const name of readdirSync("/proc")) {
            if (!/^\d+$/.test(name)) continue;
            const pid = Number(name);
            scanned++;
            let uid;
            try { uid = statSync(`/proc/${pid}`).uid; } catch (e) { denials.push(`pid ${pid}: STAT ${e.code}`); continue; }
            try { readlinkSync(`/proc/${pid}/cwd`); } catch (e) {
              if (e.code === "ENOENT" || e.code === "ESRCH") continue;
              (uid === me ? denials : blind).push(`pid ${pid} uid=${uid} cwd ${e.code} comm=${safeComm(pid)}`);
              continue;
            }
            try { readdirSync(`/proc/${pid}/fd`); } catch (e) {
              if (e.code === "ENOENT" || e.code === "ESRCH") continue;
              (uid === me ? denials : blind).push(`pid ${pid} uid=${uid} fd ${e.code} comm=${safeComm(pid)}`);
            }
          }
          function safeComm(pid) { try { return require("node:fs").readFileSync(`/proc/${pid}/comm`, "utf8").trim(); } catch { return "?"; } }
          console.log(`scanner uid=${me}, scanned=${scanned}`);
          console.log(`SAME-UID DENIALS (${denials.length}):`); for (const d of denials) console.log("  " + d);
          console.log(`CROSS-UID (${blind.length}):`); for (const d of blind.slice(0, 5)) console.log("  " + d); console.log(`  ... (${blind.length} total)`);
          '
