# Release 流水线：仅由 v* tag 触发，职责限定两件事——
#   1) npm-payload：公开 npm 包（Hub payload）的门槛式发布（provenance / OIDC）；
#   2) desktop-release：GitHub Release 草稿与 Electron 桌面安装包占位上传。
# 常规 push/PR 校验全部在 ci.yml，本文件不参与，互不影响。
# 诚实性约束：workspace 包均 private 时，npm-payload 必须走占位跳过分支，
# 绝不执行注定失败或超出元数据授权范围的 npm publish。

name: Release

on:
  push:
    tags:
      - 'v*'

# 同一 tag 的重复运行串行排队，避免草稿 Release 创建/更新竞态。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 工作流级最小权限；需要提权的 job 在各自 jobs.<id>.permissions 单独声明。
permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # 阶段一：tag 与包元数据校验（构建前把关，避免白跑构建）。
  # ------------------------------------------------------------------
  verify:
    name: Verify tag and versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.scan.outputs.version }}
      publishable-count: ${{ steps.scan.outputs.publishable-count }}
      publishable-packages: ${{ steps.scan.outputs.publishable-packages }}
      desktop-present: ${{ steps.scan.outputs.desktop-present }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      # 门槛规则是元数据驱动的，不维护包名单：
      #   - tag 必须形如 v<semver>；
      #   - 公开包（private !== true）版本必须与 tag 完全锁步，缺 repository 字段直接失败
      #     （npm provenance 会校验发布源仓库，缺失必然被拒，提前在此报错）；
      #   - private 包版本不一致仅告警，不阻断（允许桌面端等自有版本节奏）。
      # 扫描 packages/ 至多两层（覆盖未来的 packages/desktop/payload），
      # 排除 node_modules / dist / 点开头目录。
      - name: Scan packages and verify versions
        id: scan
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync, existsSync, readFileSync, readdirSync } from 'node:fs';
          import { dirname, join } from 'node:path';

          const fail = (msg) => { console.error(`::error::${msg.replace(/\n/g, '； ')}`); process.exit(1); };
          const warn = (msg) => console.log(`::warning::${msg}`);
          const out = (k, v) => appendFileSync(process.env.GITHUB_OUTPUT, `${k}=${v}\n`);

          const tag = process.env.GITHUB_REF_NAME || '';
          const tagVersion = /^v(.+)$/.exec(tag)?.[1] ?? '';
          if (!tagVersion) fail(`release tag 必须形如 v<semver>，实际为 "${tag}"`);
          if (!/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(tagVersion)) {
            fail(`tag "${tag}" 中的版本号 "${tagVersion}" 不是合法 semver`);
          }

          const found = [];
          const walk = (dir, depth) => {
            if (!existsSync(dir)) return;
            for (const ent of readdirSync(dir, { withFileTypes: true })) {
              if (ent.name === 'node_modules' || ent.name === 'dist' || ent.name.startsWith('.')) continue;
              const p = join(dir, ent.name);
              if (ent.isDirectory()) {
                if (depth > 0) walk(p, depth - 1);
              } else if (ent.name === 'package.json') {
                found.push(p);
              }
            }
          };
          walk('packages', 2);
          if (found.length === 0) fail('packages/ 下未发现任何 package.json');

          const pkgs = found.map((file) => {
            let raw;
            try {
              raw = JSON.parse(readFileSync(file, 'utf8'));
            } catch (e) {
              fail(`解析 ${file} 失败：${e.message}`);
            }
            return {
              file,
              dir: dirname(file),
              name: typeof raw.name === 'string' ? raw.name : `(未命名 ${file})`,
              version: typeof raw.version === 'string' ? raw.version : '',
              isPrivate: raw.private === true,
              hasRepository: raw.repository != null,
            };
          });

          const publishable = pkgs.filter((p) => !p.isPrivate);

          const mismatched = publishable.filter((p) => p.version !== tagVersion);
          if (mismatched.length > 0) {
            fail(
              `以下公开包版本与 tag ${tag} 不一致，必须锁步后再打 tag：` +
                mismatched.map((p) => `${p.name}@${p.version} (${p.file})`).join('； ')
            );
          }
          const noRepo = publishable.filter((p) => !p.hasRepository);
          if (noRepo.length > 0) {
            fail(
              `以下公开包缺少 repository 字段（npm provenance 必需）：` +
                noRepo.map((p) => `${p.name} (${p.file})`).join('； ')
            );
          }
          for (const p of pkgs.filter((x) => x.isPrivate && x.version !== tagVersion)) {
            warn(`private 包 ${p.name}@${p.version} 与 tag 版本 ${tagVersion} 不一致（仅提示，不阻断）`);
          }

          out('version', tagVersion);
          out('publishable-count', publishable.length);
          out('publishable-packages', JSON.stringify(publishable.map((p) => ({ name: p.name, dir: p.dir }))));
          out('desktop-present', existsSync('packages/desktop') ? 'true' : 'false');
          console.log(`tag=${tag} 公开可发布包 ${publishable.length}/${pkgs.length}：`);
          for (const p of publishable) console.log(`  - ${p.name}@${p.version} (${p.dir})`);
          EOF

  # ------------------------------------------------------------------
  # 阶段二：构建与测试（等价 ci.yml 的 ubuntu 通道，作为发布门槛）。
  # 覆盖 protocol / kernel / node / cli / web，未来 workspace 内新增的
  # payload / desktop 包（pnpm-workspace.yaml 登记）自动纳入。
  # ------------------------------------------------------------------
  build:
    name: Build and test
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build

      - name: Run all tests
        run: pnpm test:all

  # ------------------------------------------------------------------
  # 阶段三 A：npm Hub payload 条件发布。
  # 门槛 = verify 输出的 publishable-count > 0；当前 workspace 全部包
  # private: true，本作业稳定走占位跳过分支（绿色成功，不执行任何 publish）。
  # ------------------------------------------------------------------
  npm-payload:
    name: npm payload (conditional publish)
    needs: [verify, build]
    permissions:
      contents: read
      id-token: write # npm provenance 依赖 OIDC 生成来源证明
    runs-on: ubuntu-latest
    env:
      PUBLISHABLE_PACKAGES: ${{ needs.verify.outputs.publishable-packages }}
      PUBLISHABLE_COUNT: ${{ needs.verify.outputs.publishable-count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      # registry-url 让 setup-node 写入 ~/.npmrc，认证令牌来自
      # NODE_AUTH_TOKEN（secret 引用，不入库、不打日志）。
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish gate
        id: gate
        run: |
          set -eu
          if [ "$PUBLISHABLE_COUNT" -gt 0 ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "检测到 $PUBLISHABLE_COUNT 个公开包，进入 npm 发布流程。"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::workspace 内全部包均为 private，无 npm payload 可发布，本作业按占位跳过（不执行任何 npm publish）。"
            echo "::notice::接入方法见 docs/releasing.md：目标包去除 private、补 repository 字段、与 tag 锁步版本后，打 v* tag 即自动生效。"
          fi

      # 有待发布包但缺 secret 时在此快速失败，避免走到 publish 半途报错。
      - name: Require NPM_TOKEN secret
        if: steps.gate.outputs.skip == 'false'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::存在待发布公开包但未配置 NPM_TOKEN（Settings -> Secrets and variables -> Actions）。"
            exit 1
          fi

      # build 作业在独立 runner 上，此处重建产物供 pack 使用。
      - name: Build packages
        if: steps.gate.outputs.skip == 'false'
        run: pnpm build

      # pnpm pack 解析 workspace 协议依赖后，用 npm 发布 tarball：
      # provenance 对目录直发与 tarball 发布同样生效（npm >= 9.5，
      # Node 24 自带的 npm 满足）。
      - name: Publish to npm (provenance, public)
        if: steps.gate.outputs.skip == 'false'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          for dir in $(printf '%s' "$PUBLISHABLE_PACKAGES" | jq -r '.[].dir'); do
            name=$(jq -r '.name' "$dir/package.json")
            echo "== npm publish ${name} =="
            dest="$RUNNER_TEMP/pack/$(basename "$dir")"
            mkdir -p "$dest"
            (cd "$dir" && pnpm pack --pack-destination "$dest" >/dev/null)
            tgz=$(ls "$dest"/*.tgz | head -n 1)
            echo "   tarball: $tgz"
            npm publish "$tgz" --provenance --access public
          done

  # ------------------------------------------------------------------
  # 阶段三 B：GitHub Release（Electron 桌面安装包占位）。
  # 与 npm-payload 职责严格分离：本作业只碰 GitHub Release，
  # 不接触 npm registry。packages/desktop 不存在时仍创建占位草稿，
  # 便于人工核对后发布；存在时上传其 dist/ 下全部安装包产物。
  # ------------------------------------------------------------------
  desktop-release:
    name: GitHub Release (desktop placeholder)
    needs: [verify, build]
    permissions:
      contents: write # 创建草稿 Release 并上传安装包附件
    runs-on: ubuntu-latest
    env:
      PAYLOAD_COUNT: ${{ needs.verify.outputs.publishable-count }}
      DESKTOP_PRESENT: ${{ needs.verify.outputs.desktop-present }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create draft release
        run: |
          set -eu
          if [ "$PAYLOAD_COUNT" -gt 0 ]; then
            payload_line="npm Hub payload：$PAYLOAD_COUNT 个公开包已执行 npm publish（含 provenance），详见 npm-payload 作业日志。"
          else
            payload_line="npm Hub payload：workspace 内暂无公开包，npm 发布按占位跳过（接入指南见 docs/releasing.md）。"
          fi
          if [ "$DESKTOP_PRESENT" = "true" ]; then
            desktop_line="桌面安装包（Electron）：见下方附件。"
          else
            desktop_line="桌面安装包（Electron）：尚未接入（packages/desktop 不存在），本 Release 为占位草稿。"
          fi
          notes=$(mktemp --suffix=.md)
          printf '## npm Hub payload\n%s\n\n## 桌面安装包（Electron）\n%s\n' "$payload_line" "$desktop_line" > "$notes"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release 已存在，更新草稿说明。"
            gh release edit "$TAG" --repo "$REPO" --draft --notes-file "$notes"
          else
            gh release create "$TAG" --repo "$REPO" --draft --generate-notes --notes-file "$notes" --title "$TAG"
          fi

      # 桌面包存在但 dist 为空属真实故障，显式失败，不静默发空 Release。
      - name: Upload desktop installers
        if: env.DESKTOP_PRESENT == 'true'
        run: |
          set -eu
          shopt -s nullglob
          files=(packages/desktop/dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::packages/desktop 存在但 dist/ 下没有任何安装包产物，拒绝空发布。"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber
