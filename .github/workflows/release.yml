# Release pipeline: triggered only by v* tags, responsibility chain —
#   verify → build (full build and tests on ubuntu)
#   → npm-payload (published only once on ubuntu, after all gates pass).
#
# npm publishing converges to a single entry point: the sole authority is
# packages/payload/dist/package.json (a build artifact; default name @team4u/helm-hub,
# overridable at build time via the HELM_PAYLOAD_PACKAGE env). The workspace's
# @helm/payload is forever a private assembler: publishing must run npm pack /
# npm publish inside the dist directory (the tarball root is the payload root, with
# the manifest at the root); never run pnpm pack on the workspace package
# — that would nest everything under the dist/ path prefix, and the updater's
# root-layout probing would inevitably fail.
#
# Honesty constraints:
#   - Publishing gate = the private / version (locked to the tag) / repository fields of
#     dist/package.json + the existence of NPM_TOKEN (injected as NODE_AUTH_TOKEN); if
#     any item is unmet, fail or skip explicitly before publishing;
#   - The npm payload is built and published once on ubuntu only.

name: Release

on:
  push:
    tags:
      - 'v*'

# Repeat runs for the same tag are queued serially, avoiding draft Release create/update races.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Workflow-level least privilege; jobs needing elevation declare their own
# jobs.<id>.permissions.
permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Stage 1: tag validation and payload assembler probing (gate before build).
  # ------------------------------------------------------------------
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.scan.outputs.version }}
      payload-present: ${{ steps.scan.outputs.payload-present }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      # Only validate the tag shape and assembler existence; npm publish decisions always
      # defer to the build artifact packages/payload/dist/package.json (see npm-payload);
      # no repo-wide non-private scan — there is exactly one publish entry point.
      - name: Verify tag and payload builder
        id: scan
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';

          const fail = (msg) => { console.error(`::error::${msg.replace(/\n/g, '; ')}`); process.exit(1); };
          const warn = (msg) => console.log(`::warning::${msg}`);
          const out = (k, v) => appendFileSync(process.env.GITHUB_OUTPUT, `${k}=${v}\n`);

          const tag = process.env.GITHUB_REF_NAME || '';
          const tagVersion = /^v(.+)$/.exec(tag)?.[1] ?? '';
          if (!tagVersion) fail(`release tag must look like v<semver>, got "${tag}"`);
          if (!/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(tagVersion)) {
            fail(`version "${tagVersion}" in tag "${tag}" is not valid semver`);
          }
          out('version', tagVersion);

          const payloadPresent = existsSync('packages/payload/package.json');
          out('payload-present', payloadPresent ? 'true' : 'false');
          if (!payloadPresent) {
            warn('packages/payload does not exist: npm-payload will be skipped as a placeholder (no npm publish runs at all).');
          } else {
            const builder = JSON.parse(readFileSync('packages/payload/package.json', 'utf8'));
            if (builder.private !== true) {
              warn(`assembler ${builder.name} must stay private: true (npm publishing only honors packages/payload/dist/package.json; never pack the workspace package).`);
            }
            if (typeof builder.version === 'string' && builder.version !== tagVersion) {
              warn(`assembler ${builder.name}@${builder.version} differs from tag version ${tagVersion} (the payload version has a single source; keep them in lockstep).`);
            }
          }
          EOF

  # ------------------------------------------------------------------
  # Stage 2: build and full test suite (equivalent to ci.yml's ubuntu lane, as the
  # release gate).
  # ------------------------------------------------------------------
  build:
    name: Build and test
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build

      - name: Run all tests
        run: pnpm test:all

      - name: Verify npm payload pack/install/start
        env:
          PAYLOAD_NPM_SMOKE: '1'
        run: node scripts/run-tests.mjs packages/payload/test/payload.test.ts

  # ------------------------------------------------------------------
  # Stage 3A: conditional npm Hub payload publish (the single npm entry point,
  # ubuntu only, once).
  # ------------------------------------------------------------------
  npm-payload:
    name: npm payload (conditional publish)
    needs: [verify, build]
    permissions:
      contents: read
      id-token: write # npm provenance relies on OIDC to attest provenance
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.result.outputs.published }}
      status-line: ${{ steps.result.outputs.status-line }}
    env:
      PAYLOAD_PRESENT: ${{ needs.verify.outputs.payload-present }}
      TAG_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      # registry-url makes setup-node write ~/.npmrc; the auth token comes from
      # NODE_AUTH_TOKEN (a secret reference, never committed, never logged).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The build job ran on a separate runner; rebuild the workspace artifacts here to
      # assemble packages/payload/dist.
      - name: Build packages (assemble payload dist)
        run: pnpm build

      # The build artifact dist/package.json is the sole publishing authority: a missing
      # file = the assembler contract is broken (explicit failure); private = explicitly
      # not publishing (skip branch); public requires the version locked to the tag and
      # the repository field (required by provenance) before publishing proceeds.
      - name: Inspect payload npm package
        id: payload
        if: env.PAYLOAD_PRESENT == 'true'
        run: |
          set -eu
          pkg=packages/payload/dist/package.json
          if [ ! -f "$pkg" ]; then
            echo "::error::packages/payload build did not produce $pkg (assembler contract: the dist root must contain a publishable package.json with name/version/files)."
            exit 1
          fi
          name=$(jq -r '.name // empty' "$pkg")
          version=$(jq -r '.version // empty' "$pkg")
          if [ -z "$name" ] || [ -z "$version" ]; then
            echo "::error::$pkg is missing the name or version field; refusing to publish."
            exit 1
          fi
          echo "payload npm package: ${name}@${version}"
          if [ "$(jq -r '.private // false' "$pkg")" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::payload npm package ${name} is marked private: true; skipped as a placeholder (no npm publish runs at all)."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" != "$TAG_VERSION" ]; then
            echo "::error::payload npm package ${name}@${version} does not match tag ${TAG_VERSION}; keep versions in lockstep before tagging."
            exit 1
          fi
          if [ "$(jq -r 'has("repository")' "$pkg")" != "true" ]; then
            echo "::error::payload npm package ${name} is missing the repository field (required by npm provenance, and it must point to this repository)."
            exit 1
          fi

      # Fail fast here when a package is due to publish but the secret is missing:
      # an explicit gate, never falsely claim a publish.
      - name: Require NPM_TOKEN secret
        if: env.PAYLOAD_PRESENT == 'true' && steps.payload.outputs.skip == 'false'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::payload npm package is due to publish but NPM_TOKEN is not configured (Settings -> Secrets and variables -> Actions), or switch to npm Trusted Publishing (not enabled)."
            exit 1
          fi

      # Run npm pack / npm publish inside the dist directory: the tarball root is the
      # payload root (manifest.json, package.json, start.mjs at the root). Never pnpm
      # pack the workspace package — tar would nest the manifest under the dist/ path
      # prefix, and the updater's root-layout probing would inevitably fail.
      - name: Publish payload package from dist (provenance, public)
        id: publish
        if: env.PAYLOAD_PRESENT == 'true' && steps.payload.outputs.skip == 'false'
        env:
          # Fix note: setup-node(registry-url) writes NODE_AUTH_TOKEN as the ~/.npmrc key,
          # and npm publish actually reads it; previously injecting only NPM_TOKEN
          # guaranteed an auth failure.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          dest="$RUNNER_TEMP/pack"
          mkdir -p "$dest"
          (cd packages/payload/dist && npm pack --pack-destination "$dest" >/dev/null)
          tgz=$(ls "$dest"/*.tgz | head -n 1)
          echo "tarball: $tgz ($(du -h "$tgz" | cut -f1))"
          npm publish "$tgz" --provenance --access public

      # Summarize the actual outcome for desktop-release's Release notes: state facts only.
      - name: Record publish result
        id: result
        if: always()
        env:
          PAYLOAD_SKIP: ${{ steps.payload.outputs.skip }}
          PAYLOAD_NAME: ${{ steps.payload.outputs.name }}
          PAYLOAD_VERSION: ${{ steps.payload.outputs.version }}
          PUBLISH_CONCLUSION: ${{ steps.publish.conclusion }}
        run: |
          set -eu
          if [ "$PAYLOAD_PRESENT" != "true" ]; then
            published=false
            line='packages/payload does not exist; no npm publish was executed.'
          elif [ "$PAYLOAD_SKIP" = "true" ]; then
            published=false
            line='payload npm package is marked private (or produced no publishable package.json); skipped as a placeholder, no npm publish was executed.'
          elif [ "$PUBLISH_CONCLUSION" = "success" ]; then
            published=true
            line="Published \`${PAYLOAD_NAME}@${PAYLOAD_VERSION}\` to npmjs.com (with provenance); see the npm-payload job logs."
          else
            published=false
            line="npm publish did not complete (npm-payload job ${PUBLISH_CONCLUSION:-not executed}); this draft contains no npm publish result."
          fi
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "status-line<<EOF" >> "$GITHUB_OUTPUT"
          echo "$line" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "published=$published"
          echo "status: $line"
