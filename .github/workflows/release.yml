# Release pipeline: triggered only by v* tags, responsibility chain —
#   verify → build (full build and tests on ubuntu) → npm-publish
#   (both artifacts publish once, on ubuntu, after all gates pass).
#
# npm publishing authority is per artifact, exactly one manifest each: the Hub payload's sole
# authority is packages/payload/dist/package.json (a build artifact; default name @team4u/helm-hub,
# overridable at build time via the HELM_PAYLOAD_PACKAGE env), and the stable CLI's sole authority
# is packages/payload/dist-cli/package.json (a build artifact; default name @team4u/helm, bin helm,
# overridable via HELM_CLI_PACKAGE). The workspace's @helm/payload is forever a private assembler:
# publishing must run npm pack / npm publish inside the respective dist directory (the tarball root
# is the package root, with the manifest at the root); never run pnpm pack on the workspace package —
# that would nest everything under the dist/ path prefix, and the updater's root-layout probing
# would inevitably fail.
#
# Honesty constraints:
#   - Each publishing gate = the private / version (locked to the tag) / repository fields of its
#     dist manifest + the existence of NPM_TOKEN (injected as NODE_AUTH_TOKEN); if any item is
#     unmet, fail or skip explicitly before publishing;
#   - The CLI additionally requires an empty dependency set (it ships as a zero-dependency
#     single-file bundle of the complete helm CLI; a workspace: / file: / @helm/* dependency would
#     break `npm install -g` for every consumer because no @helm/* package is published), and
#     publishes only after the payload published in the same run (the CLI's default update path
#     resolves the payload from the npm registry);
#   - dist-tag policy (both artifacts, decided once in verify): a semver prerelease (a hyphen in
#     the version core, e.g. 1.2.3-rc.1) publishes under `beta`; build metadata (e.g. 1.2.3+build-7)
#     is not a prerelease and stays on `latest`. Pre-releases never implicitly become latest;
#   - Both artifacts are built and published once on ubuntu only.

name: Release

on:
  push:
    tags:
      - 'v*'

# Repeat runs for the same tag are queued serially, avoiding draft Release create/update races.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Workflow-level least privilege; jobs needing elevation declare their own
# jobs.<id>.permissions.
permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Stage 1: tag validation and payload assembler probing (gate before build).
  # ------------------------------------------------------------------
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.scan.outputs.version }}
      dist-tag: ${{ steps.scan.outputs.dist-tag }}
      payload-present: ${{ steps.scan.outputs.payload-present }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      # Only validate the tag shape and assembler existence; npm publish decisions always defer to
      # the build-artifact manifests (packages/payload/dist/package.json and
      # packages/payload/dist-cli/package.json — see npm-publish); no repo-wide non-private
      # scan — there is exactly one publish manifest per artifact. The CLI package is a hard
      # release input (its absence means the tag cannot produce the CLI artifact at all).
      - name: Verify tag and payload builder
        id: scan
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';

          const fail = (msg) => { console.error(`::error::${msg.replace(/\n/g, '; ')}`); process.exit(1); };
          const warn = (msg) => console.log(`::warning::${msg}`);
          const out = (k, v) => appendFileSync(process.env.GITHUB_OUTPUT, `${k}=${v}\n`);

          const tag = process.env.GITHUB_REF_NAME || '';
          const tagVersion = /^v(.+)$/.exec(tag)?.[1] ?? '';
          if (!tagVersion) fail(`release tag must look like v<semver>, got "${tag}"`);
          if (!/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(tagVersion)) {
            fail(`version "${tagVersion}" in tag "${tag}" is not valid semver`);
          }
          out('version', tagVersion);

          // Dist-tag decided once, on real semver grounds: build metadata (after +) is not a
          // prerelease; a hyphen in the version core is. Both artifacts publish with this tag.
          const versionCore = tagVersion.split('+')[0];
          out('dist-tag', versionCore.includes('-') ? 'beta' : 'latest');

          const payloadPresent = existsSync('packages/payload/package.json');
          out('payload-present', payloadPresent ? 'true' : 'false');
          if (!payloadPresent) {
            warn('packages/payload does not exist: the npm-publish job will skip as a placeholder (no npm publish runs at all).');
          } else {
            const builder = JSON.parse(readFileSync('packages/payload/package.json', 'utf8'));
            if (builder.private !== true) {
              warn(`assembler ${builder.name} must stay private: true (npm publishing only honors packages/payload/dist/package.json; never pack the workspace package).`);
            }
            if (typeof builder.version === 'string' && builder.version !== tagVersion) {
              warn(`assembler ${builder.name}@${builder.version} differs from tag version ${tagVersion} (the payload version has a single source; keep them in lockstep).`);
            }
          }

          if (!existsSync('packages/cli/package.json')) {
            fail('packages/cli is a required release input (the helm CLI npm artifact bundles its dist entry) but is missing from this tag.');
          }
          const cli = JSON.parse(readFileSync('packages/cli/package.json', 'utf8'));
          if (cli.private !== true) {
            warn(`CLI workspace package ${cli.name} must stay private: true (its publish form is the assembled packages/payload/dist-cli bundle, never the workspace package).`);
          }
          EOF

  # ------------------------------------------------------------------
  # Stage 2: build and full test suite (equivalent to ci.yml's ubuntu lane, as the
  # release gate).
  # ------------------------------------------------------------------
  build:
    name: Build and test
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build

      - name: Run all tests
        run: pnpm test:all

      # Payload + CLI artifact acceptance in one gate (both artifacts come from the same
      # build.mjs assembly): assembly contracts always run; the real-tarball/global-install,
      # payload end-to-end, and CLI golden sequence ride the PAYLOAD_NPM_SMOKE network gate.
      - name: Verify npm payload and cli artifacts (pack, install, golden sequence)
        env:
          PAYLOAD_NPM_SMOKE: '1'
        run: node scripts/run-tests.mjs packages/payload/test/payload.test.ts

  # ------------------------------------------------------------------
  # Stage 3: conditional npm publish of both artifacts (payload then cli, one job —
  # they share the checkout/install/build; sequential steps keep the cli's
  # "payload must have published" coupling honest without a second runner).
  # ------------------------------------------------------------------
  npm-publish:
    name: npm publish (payload + cli, conditional)
    needs: [verify, build]
    permissions:
      contents: read
      id-token: write # npm provenance relies on OIDC to attest provenance
    runs-on: ubuntu-latest
    outputs:
      payload-published: ${{ steps.result.outputs.payload-published }}
      payload-status-line: ${{ steps.result.outputs.payload-status-line }}
      cli-published: ${{ steps.result.outputs.cli-published }}
      cli-status-line: ${{ steps.result.outputs.cli-status-line }}
    env:
      PAYLOAD_PRESENT: ${{ needs.verify.outputs.payload-present }}
      TAG_VERSION: ${{ needs.verify.outputs.version }}
      DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      # registry-url makes setup-node write ~/.npmrc; the auth token comes from
      # NODE_AUTH_TOKEN (a secret reference, never committed, never logged).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The build job ran on a separate runner; rebuild the workspace artifacts here once for
      # both publish steps: packages/payload build assembles dist/ (Hub payload) and
      # dist-cli/ (helm CLI bundle).
      - name: Build packages (assemble dist and dist-cli)
        run: pnpm build

      # ---- Hub payload -------------------------------------------------------------
      # The build artifact dist/package.json is the payload's sole publishing authority: a missing
      # file = the assembler contract is broken (explicit failure); private = explicitly not
      # publishing (skip branch); public requires the version locked to the tag and the repository
      # field (required by provenance) before publishing proceeds.
      - name: Inspect payload npm package
        id: payload
        if: env.PAYLOAD_PRESENT == 'true'
        run: |
          set -eu
          pkg=packages/payload/dist/package.json
          if [ ! -f "$pkg" ]; then
            echo "::error::packages/payload build did not produce $pkg (assembler contract: the dist root must contain a publishable package.json with name/version/files)."
            exit 1
          fi
          name=$(jq -r '.name // empty' "$pkg")
          version=$(jq -r '.version // empty' "$pkg")
          if [ -z "$name" ] || [ -z "$version" ]; then
            echo "::error::$pkg is missing the name or version field; refusing to publish."
            exit 1
          fi
          echo "payload npm package: ${name}@${version}"
          if [ "$(jq -r '.private // false' "$pkg")" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::payload npm package ${name} is marked private: true; skipped as a placeholder (no npm publish runs at all)."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" != "$TAG_VERSION" ]; then
            echo "::error::payload npm package ${name}@${version} does not match tag ${TAG_VERSION}; keep versions in lockstep before tagging."
            exit 1
          fi
          if [ "$(jq -r 'has("repository")' "$pkg")" != "true" ]; then
            echo "::error::payload npm package ${name} is missing the repository field (required by npm provenance, and it must point to this repository)."
            exit 1
          fi

      # Fail fast when a package is due to publish but the secret is missing: an explicit gate,
      # never falsely claim a publish. The CLI publishes only after the payload did, so this
      # single gate covers both artifacts' due-publish paths.
      - name: Require NPM_TOKEN secret
        if: env.PAYLOAD_PRESENT == 'true' && steps.payload.outputs.skip == 'false'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::payload npm package is due to publish but NPM_TOKEN is not configured (Settings -> Secrets and variables -> Actions), or switch to npm Trusted Publishing (not enabled)."
            exit 1
          fi

      # Run npm pack / npm publish inside the dist directory: the tarball root is the
      # payload root (manifest.json, package.json, start.mjs at the root). Never pnpm
      # pack the workspace package — tar would nest the manifest under the dist/ path
      # prefix, and the updater's root-layout probing would inevitably fail.
      - name: Publish payload package from dist (provenance, public)
        id: publish-payload
        if: env.PAYLOAD_PRESENT == 'true' && steps.payload.outputs.skip == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          dest="$RUNNER_TEMP/pack-payload"
          mkdir -p "$dest"
          (cd packages/payload/dist && npm pack --pack-destination "$dest" >/dev/null)
          tgz=$(ls "$dest"/*.tgz | head -n 1)
          echo "tarball: $tgz ($(du -h "$tgz" | cut -f1))"
          npm publish "$tgz" --provenance --access public --tag "$DIST_TAG"

      # ---- Stable CLI ----------------------------------------------------------------
      # The build artifact dist-cli/package.json is the CLI's sole publishing authority:
      # missing file = the assembler contract is broken (explicit failure); private = explicitly
      # not publishing (skip branch); publishing requires the version locked to the tag, the
      # repository field (provenance), an empty dependency set (a workspace:/file:/@helm/* dependency
      # would break `npm install -g` for every consumer), and the payload having published in this
      # run (the CLI's default update path resolves the payload from the npm registry — shipping a
      # CLI whose default flow 404s would be dishonest).
      - name: Inspect cli npm package
        id: cli
        if: env.PAYLOAD_PRESENT == 'true'
        run: |
          set -eu
          pkg=packages/payload/dist-cli/package.json
          if [ ! -f "$pkg" ]; then
            echo "::error::packages/payload build did not produce $pkg (assembler contract: the cli package must bundle into dist-cli with a publishable package.json)."
            exit 1
          fi
          name=$(jq -r '.name // empty' "$pkg")
          version=$(jq -r '.version // empty' "$pkg")
          if [ -z "$name" ] || [ -z "$version" ]; then
            echo "::error::$pkg is missing the name or version field; refusing to publish."
            exit 1
          fi
          echo "cli npm package: ${name}@${version}"
          if [ "$(jq -r '.private // false' "$pkg")" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=private" >> "$GITHUB_OUTPUT"
            echo "::notice::cli npm package ${name} is marked private: true; skipped as a placeholder (no cli npm publish runs at all)."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" != "$TAG_VERSION" ]; then
            echo "::error::cli npm package ${name}@${version} does not match tag ${TAG_VERSION}; keep versions in lockstep before tagging."
            exit 1
          fi
          if [ "$(jq -r 'has("repository")' "$pkg")" != "true" ]; then
            echo "::error::cli npm package ${name} is missing the repository field (required by npm provenance, and it must point to this repository)."
            exit 1
          fi
          deps=$(jq -r '(.dependencies // {}) | length' "$pkg")
          if [ "$deps" != "0" ]; then
            echo "::error::cli npm package ${name} declares ${deps} runtime dependencies; the cli ships as a zero-dependency single-file bundle (no @helm/* package is published, so any dependency would break npm install -g)."
            exit 1
          fi
          bins=$(jq -r '.bin // {} | length' "$pkg")
          if [ "$bins" != "1" ] || [ "$(jq -r '.bin // {} | keys[0]' "$pkg")" != "helm" ]; then
            echo "::error::cli npm package ${name} must declare exactly one bin entry named helm (single-sourced from packages/cli)."
            exit 1
          fi

      # Publish payload first: the CLI publishes only when the payload did (see Inspect).
      - name: Publish cli package from dist-cli (provenance, public)
        id: publish-cli
        if: steps.cli.outputs.skip == 'false' && steps.publish-payload.conclusion == 'success'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          dest="$RUNNER_TEMP/pack-cli"
          mkdir -p "$dest"
          (cd packages/payload/dist-cli && npm pack --pack-destination "$dest" >/dev/null)
          tgz=$(ls "$dest"/*.tgz | head -n 1)
          echo "tarball: $tgz ($(du -h "$tgz" | cut -f1))"
          npm publish "$tgz" --provenance --access public --tag "$DIST_TAG"

      # Summarize the actual outcome per artifact for the release record: state facts only.
      - name: Record publish results
        id: result
        if: always()
        env:
          PAYLOAD_SKIP: ${{ steps.payload.outputs.skip }}
          PAYLOAD_NAME: ${{ steps.payload.outputs.name }}
          PAYLOAD_VERSION: ${{ steps.payload.outputs.version }}
          PAYLOAD_PUBLISH_CONCLUSION: ${{ steps.publish-payload.conclusion }}
          CLI_SKIP: ${{ steps.cli.outputs.skip }}
          CLI_SKIP_REASON: ${{ steps.cli.outputs.skip_reason }}
          CLI_NAME: ${{ steps.cli.outputs.name }}
          CLI_VERSION: ${{ steps.cli.outputs.version }}
          CLI_PUBLISH_CONCLUSION: ${{ steps.publish-cli.conclusion }}
        run: |
          set -eu
          if [ "$PAYLOAD_PRESENT" != "true" ]; then
            payload_published=false
            payload_line='packages/payload does not exist; no npm publish was executed.'
          elif [ "$PAYLOAD_SKIP" = "true" ]; then
            payload_published=false
            payload_line='payload npm package is marked private (or produced no publishable package.json); skipped as a placeholder, no npm publish was executed.'
          elif [ "$PAYLOAD_PUBLISH_CONCLUSION" = "success" ]; then
            payload_published=true
            payload_line="Published \`${PAYLOAD_NAME}@${PAYLOAD_VERSION}\` to npmjs.com (with provenance, dist-tag ${DIST_TAG}); see the npm-publish job logs."
          else
            payload_published=false
            payload_line="payload npm publish did not complete (publish step ${PAYLOAD_PUBLISH_CONCLUSION:-not executed}); this run contains no payload publish result."
          fi

          if [ "$CLI_SKIP" = "true" ] && [ "$CLI_SKIP_REASON" = "private" ]; then
            cli_published=false
            cli_line='cli npm package is marked private; no cli npm publish was executed.'
          elif [ "$payload_published" != "true" ]; then
            cli_published=false
            cli_line='cli publish skipped: the Hub payload did not publish in this run (the cli default update path resolves the payload from the npm registry, so shipping it now would advertise a broken one-shot install).'
          elif [ "$CLI_PUBLISH_CONCLUSION" = "success" ]; then
            cli_published=true
            cli_line="Published \`${CLI_NAME}@${CLI_VERSION}\` (zero-dependency helm CLI bundle, bin helm) to npmjs.com (with provenance, dist-tag ${DIST_TAG}); see the npm-publish job logs."
          else
            cli_published=false
            cli_line="cli npm publish did not complete (publish step ${CLI_PUBLISH_CONCLUSION:-not executed}); this run contains no cli publish result."
          fi

          echo "payload-published=$payload_published" >> "$GITHUB_OUTPUT"
          echo "payload-status-line<<EOF" >> "$GITHUB_OUTPUT"
          echo "$payload_line" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "cli-published=$cli_published" >> "$GITHUB_OUTPUT"
          echo "cli-status-line<<EOF" >> "$GITHUB_OUTPUT"
          echo "$cli_line" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "payload published=$payload_published"
          echo "payload status: $payload_line"
          echo "cli published=$cli_published"
          echo "cli status: $cli_line"
