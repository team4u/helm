services:
  helm-hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: helm-hub:dev
    container_name: helm-hub
    restart: unless-stopped
    ports:
      # Host 3333 -> container 3202; other machines on the LAN reach it directly via http://<server-lan-ip>:3333
      - "0.0.0.0:3333:3202"
    environment:
      - HELM_HOST=0.0.0.0
      - HELM_PORT=3202
      - HELM_DATA_DIR=/data/.helm
    volumes:
      # Persist the Hub database, credentials and artifacts (independent of the host's ~/.helm, avoiding lock contention with the host CLI / helm-node)
      - ~/.helm-hub-docker:/data/.helm
