services:
  helmx-hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: helmx-hub:dev
    container_name: helmx-hub
    restart: unless-stopped
    ports:
      # Host 3333 -> container 3202; other machines on the LAN reach it directly via http://<server-lan-ip>:3333
      - "0.0.0.0:3333:3202"
    environment:
      - HELMX_HOST=0.0.0.0
      - HELMX_PORT=3202
      - HELMX_DATA_DIR=/data/.helmx
    volumes:
      # Persist the Hub database, credentials and artifacts (independent of the host's ~/.helmx, avoiding lock contention with the host CLI / helmx-node)
      - ~/.helmx-hub-docker:/data/.helmx
